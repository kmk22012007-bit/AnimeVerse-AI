name: Feature Request
description: Suggest an idea or enhancement for AnimeVerse AI
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! We are excited to hear ideas to make AnimeVerse AI even better.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Add a feature that allows...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target Feature Area
      options:
        - Discovery & Parametric Filters
        - Franchise Grouping & Hierarchy
        - Watch Anywhere & Streaming Providers
        - RYUK AI Recommendations
        - Community & Social Boards
        - Interactive Polls & Voting
        - Analytics & Gamification
        - Notifications & Activity Feed
        - Developer Tooling & API
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
      placeholder: An alternative approach could be...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references here.
      placeholder: Links, mockups, or related issues...
    validations:
      required: false
