name: AnimeVerse AI - Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Pytest & Django)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Django system checks
        env:
          DJANGO_SECRET_KEY: "ci-secret-key-animeverse-test-environment-12345"
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          GEMINI_API_KEY: ""
        run: |
          python backend/manage.py check

      - name: Run backend regression test suite
        env:
          DJANGO_SECRET_KEY: "ci-secret-key-animeverse-test-environment-12345"
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          GEMINI_API_KEY: ""
        run: |
          pytest backend/tests/ -v --durations=10

  frontend-build:
    name: Frontend Production Build (Vite & React)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

  repository-integrity:
    name: Repository & Documentation Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Verifying mandatory project files..."
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f CONTRIBUTING.md || (echo "CONTRIBUTING.md missing" && exit 1)
          test -f docs/ARCHITECTURE.md || (echo "docs/ARCHITECTURE.md missing" && exit 1)
          test -f backend/manage.py || (echo "backend/manage.py missing" && exit 1)
          test -f backend/requirements.txt || (echo "backend/requirements.txt missing" && exit 1)
          test -f frontend/package.json || (echo "frontend/package.json missing" && exit 1)
          test -d docs || (echo "docs directory missing" && exit 1)
          test -d docs/screenshots || (echo "docs/screenshots directory missing" && exit 1)
          echo "All structural requirements verified."

      - name: Check for committed sensitive artifacts
        run: |
          echo "Checking for committed sqlite database files..."
          if git ls-files | grep -E '\.sqlite3$'; then
            echo "Error: SQLite database files must never be committed to git."
            exit 1
          fi
          echo "Checking for committed secret env files..."
          if git ls-files | grep -E '^\.env$' | grep -v '\.example$'; then
            echo "Error: Real .env files must never be committed to git."
            exit 1
          fi
          echo "Security file inspection passed."
